[project]
name = "openlobbying"
version = "0.1.0"
description = "OpenLobbying application built on top of muckrake."
readme = "README.md"
authors = [
    { name = "Nicu Calcea", email = "mail@nicu.md" }
]
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.127.0",
    "muckrake",
    "uvicorn>=0.40.0",
]

[project.scripts]
openlobbying = "openlobbying.cli:cli"

[build-system]
requires = ["uv_build>=0.9.17,<0.10.0"]
build-backend = "uv_build"

[tool.uv.sources]
muckrake = { path = "../muckrake", editable = true }

[dependency-groups]
dev = [
    "pytest>=9.0.3",
    "ruff>=0.15",
    "mypy>=1.19",
    "pre-commit>=4.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py313"
# Unmaintained crawler stubs, kept unchanged (see datasets_parked/README.md).
extend-exclude = ["datasets_parked"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.flake8-bugbear]
# FastAPI parameter defaults such as `Query(None)` are evaluated once by design.
extend-immutable-calls = ["fastapi.Query"]
