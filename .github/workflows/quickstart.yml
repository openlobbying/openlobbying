name: Quickstart

# Runs the README Quickstart (scripts/quickstart.sh) from a fresh checkout:
# crawl one dataset into SQLite, build and publish an ingest, start the API and
# query it. The README uses gb_firs, but the FIRS register returns 403 to GitHub
# Actions runners, so CI crawls gb_prca (about 45 s), fetched live: an outage at
# the PRCA register fails this job.

on:
  pull_request:
    branches: [develop, main]
  workflow_dispatch:

jobs:
  quickstart:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v5
        with:
          path: openlobbying

      - name: Set up uv
        uses: astral-sh/setup-uv@v6

      # README Prerequisites (Debian/Ubuntu).
      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y pkg-config libicu-dev libleveldb-dev

      - name: Install dependencies
        working-directory: openlobbying
        run: uv sync --locked

      - name: Quickstart
        working-directory: openlobbying
        env:
          QUICKSTART_DATASET: gb_prca
        run: scripts/quickstart.sh
